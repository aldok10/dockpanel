[package]
name = "dockpanel-mailapi"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# Talks to the panel backend over loopback only, so no TLS is needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
hex = "0.4"
# Already in the tree via `jsonwebtoken`; used directly to read the two dates a
# listing sorts by — the `Date:` header and Dovecot's `date.received`.
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "gzip", "minified", "vendored"] }
